{% extends "base.html" %}
{% block title %}My Recipes{% endblock %}
{% block content %}
<h1>My Uploaded Recipes</h1>

{% if recipes %}
    <ul>
        {% for r in recipes %}
            <li>
                <a href="{{ url_for('uploaded_recipe_detail_page', recipe_id=r['id']) }}">
                    {{ r['recipe_name'] }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p class="empty-state">You haven't uploaded any recipes yet.</p>
{% endif %}
{% endblock %}
