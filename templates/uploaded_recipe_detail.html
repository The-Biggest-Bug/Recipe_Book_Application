{% extends "base.html" %}
{% block content %}
<h2>{{ recipe['recipe_name'] }}</h2>

{% if recipe['image_url'] %}
    <img src="{{ recipe['image_url'] }}" alt="Recipe image" style="max-width:300px;">
{% endif %}

<h3>Ingredients</h3>
<pre>{{ recipe['ingredients'] }}</pre>

<h3>Instructions</h3>
<pre>{{ recipe['instructions'] }}</pre>

{% endblock %}
